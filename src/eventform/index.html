       <!--  <main class="cards"> -->
    <body>
        <main class="wrapper">
        <h1>Contact Us Form</h1>
        <form id="ticketform">
        <div class="field">
            <label for="firstName">First Name</label>
            <input id="firstName" name="firstName" type="text" required />
        </div>
        <div class="field">
            <label for="lastName">Last Name</label>
            <input id="lastName" name="lastName" type="text" required />
        </div>
        <div class="field full">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />
        </div>
        <div class="field">
            <label for="type">Type</label>
            <select
            id="type"
            name="type"
            aria-controls="Student or Guest choice"
            required
            >
            <option value="chooseone">Choose one</option>
            <option value="student">Student</option>
            <option value="guest">Guest</option>
            </select>
        </div>
        <div class="field">
            <label for="availableDate">Event Date</label>
            <input id="availableDate" name="availableDate" type="date" required />
        </div>
        <div id="studentContainer" class="field full" hidden>
            <label for="student">Student I#</label>
            <input id="student" name="student" type="text" placeholder = "Enter 9 numbers. No spaces or dashes." pattern="[0-9]{9}"/>
        </div>
        <div id="guestContainer" class="field full" hidden>
            <label for="guest">Access Code</label>
            <input id="guest" name="guest" type="text" placeholder = "Enter Secret Guest Code: ." />
        </div>
            <button class="full" type="submit">Send Form</button>
        </form>
        <section id="output" aria-live="polite"></section>
        </main>

       <footer>
            <p>&copy; 2026 Colorado River Data consultants. All Rights Reserved.</p>
            <p id="version">40 Day Display version 0.2</p>
        </footer>
    </body>
</html>
